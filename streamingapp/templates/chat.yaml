apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.services.chat.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: {{ .Values.deploymentStrategy.maxUnavailable }}
      maxSurge: {{ .Values.deploymentStrategy.maxSurge }}
  selector:
    matchLabels:
      app: chat
  template:
    metadata:
      labels:
        app: chat
    spec:
      containers:
        - name: chat
          image: "{{ .Values.services.chat.image }}:{{ .Values.services.chat.tag }}"
          ports:
            - containerPort: {{ .Values.services.chat.port }}
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: streamingapp-config
                  key: CHAT_PORT
            - name: MONGO_URI
              valueFrom:
                configMapKeyRef:
                  name: streamingapp-config
                  key: MONGO_URI
            - name: CLIENT_URLS
              valueFrom:
                configMapKeyRef:
                  name: streamingapp-config
                  key: CLIENT_URLS
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: streamingapp-secret
                  key: JWT_SECRET
          readinessProbe:
            tcpSocket:
              port: {{ .Values.services.chat.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: {{ .Values.services.chat.port }}
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: chat-svc
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    app: chat
  ports:
    - port: {{ .Values.services.chat.port }}
      targetPort: {{ .Values.services.chat.port }}